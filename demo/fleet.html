<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c0806" />
    <meta
      name="description"
      content="A thousand live Wraith terminals streaming agent logs in one tab, drawn by a few shared WebGPU surfaces."
    />
    <title>Fleet · Wraith terminal lab</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/fleet.css" />
  </head>
  <body>
    <div id="viewport" class="viewport" aria-label="Terminal fleet">
      <div id="world" class="world"></div>
    </div>
    <header class="hud" aria-label="Fleet controls">
      <a class="mark" href="/" aria-label="Wraith home"
        ><svg viewBox="0 8 96 88" aria-hidden="true">
          <defs>
            <linearGradient id="wraith-g-fleet" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb86b" />
              <stop offset="0.55" stop-color="#ff7f6e" />
              <stop offset="1" stop-color="#d9bbff" />
            </linearGradient>
            <mask id="wraith-m-fleet">
              <rect width="100" height="100" fill="#fff" />
              <g transform="translate(7,0) skewX(-10)">
                <path
                  d="M43,34 L51,42 L43,50"
                  fill="none"
                  stroke="#000"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <rect x="57" y="46" width="16" height="6" rx="3" fill="#000" />
              </g>
            </mask>
          </defs>
          <g mask="url(#wraith-m-fleet)">
            <path
              transform="translate(7,0) skewX(-10)"
              d="M32,80 L32,40 A28,28 0 0 1 88,40 L88,80 Q83.33,89 78.67,80 Q74,71 69.33,80 Q64.67,89 60,80 Q55.33,71 50.67,80 Q46,89 41.33,80 Q36.67,71 32,80 Z"
              fill="url(#wraith-g-fleet)"
            />
          </g>
          <rect x="14" y="30" width="16" height="6" rx="3" fill="url(#wraith-g-fleet)" />
          <rect
            x="2"
            y="30"
            width="8"
            height="6"
            rx="3"
            fill="url(#wraith-g-fleet)"
            opacity="0.4"
          />
          <rect x="8" y="44" width="22" height="6" rx="3" fill="url(#wraith-g-fleet)" />
          <rect
            x="0"
            y="44"
            width="4"
            height="6"
            rx="2"
            fill="url(#wraith-g-fleet)"
            opacity="0.3"
          />
          <rect x="16" y="58" width="14" height="6" rx="3" fill="url(#wraith-g-fleet)" />
          <rect
            x="4"
            y="58"
            width="8"
            height="6"
            rx="3"
            fill="url(#wraith-g-fleet)"
            opacity="0.4"
          />
          <rect
            x="10"
            y="72"
            width="18"
            height="6"
            rx="3"
            fill="url(#wraith-g-fleet)"
            opacity="0.8"
          /></svg
        >wraith<b>_</b> <span>fleet</span></a
      >
      <div class="controls">
        <label
          >Terminals<select id="count">
            <option>64</option>
            <option>256</option>
            <option selected>1000</option>
          </select></label
        >
        <label
          >Surface<select id="mode">
            <option value="shared" selected>Shared</option>
            <option value="canvas">Per-canvas</option>
          </select></label
        >
        <label title="GPU post-process effects over each worker's shared surface"
          >Effects<select id="effects">
            <option value="off" selected>Off</option>
            <option value="crt,bloom">CRT + bloom</option>
            <option value="crt,bloom,synthwave">CRT + bloom + synthwave</option>
            <option value="synthwave">Synthwave</option>
            <option value="matrix">Matrix</option>
            <option value="warp">Warp</option>
            <option value="rain">Rain</option>
            <option value="hologram">Hologram</option>
            <option value="glitch">Glitch</option>
            <option value="crt">CRT</option>
            <option value="bloom">Bloom</option>
          </select></label
        >
        <label
          >Pace<select id="pace">
            <option value="frame" selected>Every frame</option>
            <option value="30">30 / s</option>
            <option value="10">10 / s</option>
            <option value="0">Paused</option>
          </select></label
        >
        <button id="fit" type="button" title="Fit every terminal (F)">Fit</button>
        <button id="actual" type="button" title="Actual size (1)">1:1</button>
      </div>
      <dl class="readout" id="readout" aria-live="off">
        <div style="--w: 96px">
          <dt>terminals</dt>
          <dd id="r-terminals">–</dd>
        </div>
        <div style="--w: 74px">
          <dt>display fps</dt>
          <dd id="r-fps">–</dd>
        </div>
        <div style="--w: 76px">
          <dt>updates / s</dt>
          <dd id="r-updates">–</dd>
        </div>
        <div style="--w: 82px">
          <dt>per terminal</dt>
          <dd id="r-per">–</dd>
        </div>
        <div style="--w: 114px">
          <dt>GPU-completed / s</dt>
          <dd id="r-gpu">–</dd>
        </div>
        <div style="--w: 122px">
          <dt>surface frames / s</dt>
          <dd id="r-surface">–</dd>
        </div>
        <div style="--w: 104px">
          <dt>long tasks</dt>
          <dd id="r-long">–</dd>
        </div>
        <div style="--w: 56px">
          <dt>zoom</dt>
          <dd id="r-zoom">–</dd>
        </div>
      </dl>
    </header>
    <p class="hint" id="hint">
      Scroll to zoom · drag to pan · double-click a terminal to read it · F fits all
    </p>
    <script type="module" src="/fleet.js"></script>
  </body>
</html>
