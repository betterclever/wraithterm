<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wraith · renderer comparison</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b1018;
        color: #d9e7f6;
        font: 14px system-ui;
      }
      header {
        padding: 20px 32px;
        border-bottom: 1px solid #253149;
        display: flex;
        align-items: center;
        gap: 24px;
        position: sticky;
        top: 0;
        z-index: 10;
        background: #0b1018;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      #status {
        color: #83d4b7;
        font: 12px monospace;
      }
      main {
        padding: 24px 32px;
      }
      #scene {
        width: max-content;
        min-width: 100%;
        min-height: 600px;
      }
      button,
      select {
        padding: 9px 14px;
        background: #21304b;
        border: 1px solid #435776;
        border-radius: 6px;
        color: #d9e7f6;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
      }
      a {
        color: #93b8fb;
      }
      .xterm {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wraith / complex scene</h1>
      <span id="status">Loading benchmark…</span
      ><select id="type">
        <option value="wraith">Wraith / xterm API</option>
        <option value="webgl">xterm / WebGL</option>
        <option value="dom">xterm / DOM</option>
        <option value="ghostty">Wraith / libghostty core</option></select
      ><select id="workload">
        <option value="complex">Dense styled scene</option>
        <option value="churn">Changing RGB colors</option>
        <option value="scroll">Scroll + full repaint</option></select
      ><button id="run">Run selected case</button><a href="/xterm.html">API playground</a>
    </header>
    <main>
      <div id="scene"></div>
      <pre id="result"></pre>
    </main>
    <script type="module" src="/compare.js"></script>
  </body>
</html>
