[package]
name = "wraith-launch"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Wraith launch video, rendered with fframes."

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.0", features = ["metal"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "wraith_launch"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "wraith-launch"
path = "src/main.rs"

# Not part of the engine's Cargo workspace.
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
