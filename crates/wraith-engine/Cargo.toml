[package]
name = "wraith-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
swash = "0.2.10"
harfrust = "0.13"
png = { version = "0.18", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "HtmlCanvasElement", "Performance", "Window", "DedicatedWorkerGlobalScope", "console"] }

[dev-dependencies]
png = "0.18"
flate2 = "1.1.10"
naga = { version = "30", features = ["wgsl-in"] }
